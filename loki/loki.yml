auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      endpoint: ${SEAWEEDFS_ENDPOINT}
      bucketnames: ${SEAWEEDFS_LOKI_BUCKET}
      access_key_id: ${SEAWEEDFS_ACCESS_KEY}
      secret_access_key: ${SEAWEEDFS_SECRET_KEY}
      s3forcepathstyle: true
      insecure: true
      sse:
        type: SSE-S3
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # Original schema, kept so logs ingested before the SeaweedFS cutover
    # stay queryable from the existing local loki_data volume. Do not
    # change or remove this period, or pre-cutover logs become unreadable
    # even though the chunk files are still on disk.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
    # Cutover to SeaweedFS (WORM + SSE). Set this to the actual deploy
    # date if it differs from 2026-11-20 — it must be a future date
    # relative to the previous period and cannot be backdated once set.
    - from: 2026-11-20
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # ~13 months, matches the Object Lock default retention on the SeaweedFS
  # bucket (see seaweedfs/init-bucket.sh). Keep these two in sync: if the
  # compactor tries to delete a chunk still under lock, deletion silently
  # fails and retries on the next compaction cycle.
  retention_period: 9480h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
