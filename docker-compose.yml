name: grafana-monitoring

services:
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-5000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "${TZ:-Europe/Bratislava}"
      TZ: "${TZ:-Europe/Bratislava}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-5001}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-395d}"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${ALLOY_PORT:-5002}:12345"
      # Syslog receivers for the firewall and ESET PROTECT On-Prem. Unlike
      # the port above, these must be reachable FROM those devices on the
      # LAN, so they bind separately (see SYSLOG_BIND_ADDRESS in
      # .env.example). Syslog has no built-in auth — restrict with a
      # host/network firewall rule to just those two devices' IPs.
      - "${SYSLOG_BIND_ADDRESS:-127.0.0.1}:${SYSLOG_FIREWALL_PORT:-5007}:5514/udp"
      - "${SYSLOG_BIND_ADDRESS:-127.0.0.1}:${SYSLOG_ESET_PORT:-5008}:5515/udp"
    environment:
      MONITORING_HOST: "${MONITORING_HOST:-docker-host}"
      TZ: "${TZ:-Europe/Bratislava}"
    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - prometheus
      - loki
      - cadvisor
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${CADVISOR_PORT:-5003}:8080"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-5004}:3100"
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-config.expand-env=true"
    environment:
      SEAWEEDFS_ENDPOINT: "seaweedfs:8333"
      SEAWEEDFS_LOKI_BUCKET: "${SEAWEEDFS_LOKI_BUCKET:-loki-logs}"
      SEAWEEDFS_ACCESS_KEY: "${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY in .env}"
      SEAWEEDFS_SECRET_KEY: "${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY in .env}"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  # Self-hosted S3-compatible object store for Loki. Provides Object Lock
  # (WORM) and server-side encryption — see README section 10a.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    container_name: seaweedfs
    restart: unless-stopped
    environment:
      WEED_S3_SSE_KEK: "${SEAWEEDFS_SSE_KEK:?Set SEAWEEDFS_SSE_KEK in .env (openssl rand -hex 32)}"
      TZ: "${TZ:-Europe/Bratislava}"
    command:
      - server
      - "-dir=/data"
      - "-filer"
      - "-s3"
      - "-s3.port=8333"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-5005}:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - monitoring

  # One-shot: creates the Loki bucket with Object Lock enabled (WORM) and a
  # default retention matching Loki's own retention_period, plus default
  # bucket encryption. Runs once per `docker compose up`; idempotent.
  seaweedfs-init:
    image: amazon/aws-cli:2.41.2
    container_name: seaweedfs-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: "${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY in .env}"
      AWS_SECRET_ACCESS_KEY: "${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY in .env}"
      AWS_DEFAULT_REGION: "us-east-1"
      S3_ENDPOINT: "http://seaweedfs:8333"
      BUCKET_NAME: "${SEAWEEDFS_LOKI_BUCKET:-loki-logs}"
      RETENTION_MODE: "${SEAWEEDFS_RETENTION_MODE:-GOVERNANCE}"
      RETENTION_DAYS: "395"
    volumes:
      - ./seaweedfs/init-bucket.sh:/init/init-bucket.sh:ro
    depends_on:
      - seaweedfs
    networks:
      - monitoring

networks:
  monitoring:
    name: grafana-monitoring

volumes:
  grafana_data:
  prometheus_data:
  alloy_data:
  loki_data:
  seaweedfs_data:
